name: Safe production release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Tag, branch or commit SHA da pubblicare'
        required: true
        default: 'main'
      confirm_production:
        description: 'Scrivi DEPLOY per confermare il rilascio in produzione'
        required: true
      apply_migrations:
        description: 'Verifica e applica le migrazioni Supabase prima del frontend'
        required: true
        type: boolean
        default: true
      disable_pwa:
        description: 'Disabilita service worker (solo build diagnostiche)'
        required: true
        type: boolean
        default: false

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      release_ref: ${{ steps.release.outputs.ref }}
      apply_migrations: ${{ steps.release.outputs.apply_migrations }}
      disable_pwa: ${{ steps.release.outputs.disable_pwa }}
    steps:
      - name: Require explicit production confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          if [ "$CONFIRM_PRODUCTION" != "DEPLOY" ]; then
            echo "Release cancelled: confirm_production must be DEPLOY."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.release_ref }}
          fetch-depth: 0

      - name: Require a release commit reachable from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Resolve immutable release commit
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          MANUAL_APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          MANUAL_DISABLE_PWA: ${{ inputs.disable_pwa }}
          MANUAL_RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          apply_migrations="$MANUAL_APPLY_MIGRATIONS"
          disable_pwa="$MANUAL_DISABLE_PWA"
          release_ref="$MANUAL_RELEASE_REF"

          if [ "$EVENT_NAME" = "push" ]; then
            apply_migrations="false"
            disable_pwa="false"
            release_ref="main"

            if ! git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null || \
              ! git diff --quiet "$EVENT_BEFORE" "$release_sha" -- supabase/migrations; then
              apply_migrations="true"
            fi
          fi

          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "apply_migrations=$apply_migrations" >> "$GITHUB_OUTPUT"
          echo "disable_pwa=$disable_pwa" >> "$GITHUB_OUTPUT"

      - name: Verify migration structure
        run: bash tool/check_supabase_migrations.sh

      - name: Test admin statistics on isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/admin-stats-test" @electric-sql/pglite@0.5.8 --no-audit --no-fund
          PGLITE_MODULE="$RUNNER_TEMP/admin-stats-test/node_modules/@electric-sql/pglite/dist/index.js" node tool/test_admin_statistics.mjs

  verify-release:
    name: Analyze and test
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify web-safe environment access
        run: bash tool/verify_web_compat.sh

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run unit and widget tests
        run: flutter test --no-pub

      - name: Run read-only Supabase tests on staging
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          TEST_IMAGE_URL: ${{ secrets.STAGING_TEST_IMAGE_URL }}
        run: bash tool/run_supabase_readonly_staging.sh

  migrate-production:
    name: Migrate production database
    needs: [validate-release, verify-release]
    if: ${{ needs.validate-release.outputs.apply_migrations == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Verify and apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$PROJECT_REF"
          test -n "$DB_PASSWORD"
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase migration list --linked
          supabase db push --linked --dry-run
          supabase db push --linked

  build-pages:
    name: Build GitHub Pages artifact
    needs: [validate-release, verify-release, migrate-production]
    if: >-
      ${{
        always() &&
        needs.validate-release.result == 'success' &&
        needs.verify-release.result == 'success' &&
        (needs.migrate-production.result == 'success' || needs.migrate-production.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Build web bundle (CanvasKit)
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          DISABLE_PWA: ${{ needs.validate-release.outputs.disable_pwa }}
          BUILD_SHA: ${{ needs.validate-release.outputs.release_sha }}
          BUILD_REF: ${{ needs.validate-release.outputs.release_ref }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          if [ "$DISABLE_PWA" = "true" ]; then PWA_FLAG="--pwa-strategy=none"; else PWA_FLAG=""; fi
          flutter build web \
            --release $PWA_FLAG \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=BUILD_SHA="$BUILD_SHA" \
            --dart-define=BUILD_REF="$BUILD_REF"

      - name: Add CNAME for custom domain
        run: echo honoo.it > build/web/CNAME

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-pages
    if: ${{ always() && needs.build-pages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
